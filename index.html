<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6366f1"><title>KasirKu</title>
<style>
:root{--a:#6366f1;--bg:#f2f3f9;--c:#fff;--t:#1d1e33;--m:#7b7d98;--b:#e4e6f0}
:root.d{--bg:#0e0f1f;--c:#191a30;--t:#eceefc;--m:#9a9cc0;--b:#2a2c48}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font:15px/1.4 system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--t);padding-bottom:calc(88px + env(safe-area-inset-bottom))}
svg{width:24px;height:24px;display:block;margin:auto}
header{background:linear-gradient(135deg,var(--a),color-mix(in srgb,var(--a) 55%,#000));color:#fff;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
.br{display:flex;align-items:center;gap:10px}.br img,.br>svg{width:38px;height:38px;border-radius:12px;background:#fff3;padding:0;object-fit:cover}.br small{color:#ffffffcc;display:block;font-size:11px}
nav{position:fixed;bottom:0;left:0;right:0;background:color-mix(in srgb,var(--c) 92%,transparent);backdrop-filter:blur(14px);display:flex;justify-content:space-around;align-items:flex-end;border-radius:22px 22px 0 0;box-shadow:0 -6px 24px #0000001a;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:6}
nav a{flex:1;text-align:center;font-size:11px;color:var(--m);cursor:pointer;padding:2px 0}nav a.on{color:var(--a);font-weight:700}
.fab{width:60px;height:60px;border-radius:50%;border:0;background:var(--a);color:#fff;margin-top:-34px;box-shadow:0 8px 20px color-mix(in srgb,var(--a) 50%,transparent);cursor:pointer;flex:none}.fab svg{width:28px;height:28px;stroke-width:2.4}
.lg{width:64px;height:64px;border-radius:20px;margin:0 auto 10px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--a),color-mix(in srgb,var(--a) 55%,#000))}.lg svg{width:32px;height:32px}
#sb{display:none}
@media(min-width:900px){nav{display:none}body{padding:0 0 0 232px}#sb{display:block;position:fixed;left:0;top:0;bottom:0;width:232px;background:var(--c);padding:16px 10px;overflow:auto;border-right:1px solid var(--b)}header{margin-left:0}
#sb a{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;color:var(--m);cursor:pointer;margin-bottom:2px}#sb a svg{margin:0;width:20px;height:20px}#sb a.on{background:color-mix(in srgb,var(--a) 14%,transparent);color:var(--a);font-weight:700}}
main{max-width:1000px;margin:auto;padding:14px;animation:f .25s}@keyframes f{from{opacity:.4;transform:translateY(6px)}}
.card{background:var(--c);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 4px 18px #0000000d}
.btn{background:var(--a);color:#fff;border:0;border-radius:12px;padding:11px 16px;font:inherit;font-weight:600;cursor:pointer;width:100%}
.btn.s{width:auto;padding:6px 12px;font-size:13px}.btn.g{background:var(--b);color:var(--t)}.btn.r{background:#ef4444}.btn:active{transform:scale(.97)}
input,select{width:100%;padding:11px;border:1px solid var(--b);border-radius:12px;background:var(--c);color:var(--t);font:inherit;margin:4px 0 8px}
label{font-size:12px;color:var(--m)}small{color:var(--m)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:10px;align-content:start}
.p{background:var(--c);border-radius:16px;padding:8px;cursor:pointer;border:1px solid var(--b);font-size:13px}.p img{width:100%;height:78px;object-fit:cover;border-radius:12px;background:var(--b);display:block;margin-bottom:6px}
.chip{display:inline-block;padding:6px 13px;border-radius:99px;background:var(--b);margin:0 6px 8px 0;font-size:13px;cursor:pointer}.chip.on{background:var(--a);color:#fff}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--b)}
.two{display:grid;grid-template-columns:1fr;gap:12px}@media(min-width:800px){.two{grid-template-columns:2fr 1fr}}
.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}@media(min-width:700px){.kpi{grid-template-columns:repeat(4,1fr)}}
.kpi div{background:var(--c);border-radius:16px;padding:12px}.kpi b{display:block;font-size:19px;color:var(--a)}
.tl{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}.tl a{background:var(--bg);border-radius:16px;padding:14px 4px;font-size:12px;cursor:pointer;color:var(--t)}.tl a svg{color:var(--a);margin-bottom:6px}
.net{background:color-mix(in srgb,var(--a) 12%,transparent);border-radius:14px;padding:12px;margin:8px 0;display:flex;justify-content:space-between}.net b{color:var(--a);font-size:18px}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--b)}.tag.x{background:#ef444422;color:#ef4444}
#md{position:fixed;inset:0;background:#0007;backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center;z-index:9}#md.on{display:flex}
#md>div{background:var(--c);width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px;animation:u .25s}@keyframes u{from{transform:translateY(40px);opacity:0}}
@media(min-width:900px){#md{align-items:center}#md>div{border-radius:24px}}
#ts{position:fixed;top:calc(12px + env(safe-area-inset-top));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:20;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;background:#1d1e33ee;color:#fff;padding:10px 16px 10px 10px;border-radius:99px;backdrop-filter:blur(10px);box-shadow:0 10px 30px #0004;animation:t .35s;max-width:92%;font-size:14px}
.toast i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;background:#10b981}.toast.err i{background:#ef4444}.toast.i i{background:#0ea5e9}
@keyframes t{from{transform:translateY(-30px) scale(.9);opacity:0}}
#struk{font:12px/1.5 monospace;background:#fff;color:#000;padding:10px;border-radius:10px;margin-bottom:10px}
@media print{body *{visibility:hidden}#struk,#struk *{visibility:visible}#struk{position:absolute;left:0;top:0;width:58mm}}
</style></head><body><div id=ts></div>
<script>
const $=s=>document.querySelector(s),rp=n=>'Rp'+Math.round(+n||0).toLocaleString('id-ID'),N=x=>+x||0,
dt=t=>new Date(N(t)).toLocaleString('id-ID',{dateStyle:'short',timeStyle:'short'}),uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const API_DEFAULT=''; // (opsional) isi URL Apps Script di sini agar semua perangkat otomatis terhubung
let API=localStorage.api||API_DEFAULT,ME=JSON.parse(localStorage.me||'null'),D={},cart=[],disc=0,cat='Semua',q='',V='home',LT,LOC,stm,FC,AC,pf2='Semua',ptab='Barang Jadi',VC='';
['Users','Products','Stok','Transfers','Gaji','Trx','Debts','Shifts','Absen','Branches','Settings'].forEach(k=>D[k]=[]);
const IC={home:'<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1z"/>',cart:'<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.4a1 1 0 0 0 1 .6h8.8a1 1 0 0 0 1-.8L20 8H6"/>',box:'<path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M3 7l9 5 9-5M12 12v10"/>',dots:'<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>',plus:'<path d="M12 5v14M5 12h14"/>',chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',book:'<path d="M4 4h12a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3z"/><path d="M8 8h7"/>',receipt:'<path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"/><path d="M9 7h6M9 11h6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',camera:'<path d="M3 8h4l2-3h6l2 3h4v12H3z"/><circle cx="12" cy="13" r="3.5"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-4 3-6 7-6s7 2 7 6M17 5a3.5 3.5 0 0 1 0 7M22 20c0-3-2-5-4-5.5"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',truck:'<path d="M2 6h12v10H2zM14 9h4l4 4v3h-8z"/><circle cx="6" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',wallet:'<path d="M3 7h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 7l12-4v4M16 14h2"/>',flask:'<path d="M9 3h6M10 3v6l-6 10a2 2 0 0 0 2 3h12a2 2 0 0 0 2-3l-6-10V3"/>'};
const ic=n=>`<svg viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=1.7 stroke-linecap=round stroke-linejoin=round>${IC[n]}</svg>`;
const th=()=>{document.documentElement.style.setProperty('--a',localStorage.a||'#6366f1');document.documentElement.classList.toggle('d',localStorage.d=='1')};th();
function toast(m,t='ok'){const e=document.createElement('div');e.className='toast '+t;e.innerHTML=`<i>${{ok:'✓',err:'!',i:'i'}[t]}</i><span>${m}</span>`;$('#ts').appendChild(e);setTimeout(()=>e.remove(),3300)}
const md=h=>{$('#md').innerHTML='<div>'+h+'</div>';$('#md').className='on'},cl=()=>$('#md').className='',
ask=(m,cb)=>{AC=cb;md(`<h3>${m}</h3><br><button class="btn r" onclick="cl();AC()">Ya, lanjutkan</button><button class="btn g" style="margin-top:8px" onclick=cl()>Batal</button>`)};
async function api(a,t,d,x){try{const r=await fetch(API,{method:'POST',body:JSON.stringify({u:ME?ME.user:'',p:ME?ME.p:'',a,t,d,...x})});return await r.json()}catch(e){return{ok:0,err:'Gagal terhubung ke server'}}}
const load=(...t)=>Promise.all(t.map(async n=>{const r=await api('list',n);if(r.ok)D[n]=r.d})),save=(t,d)=>api('save',t,d),del=(t,id)=>api('del',t,{id}),batch=d=>api('batch',0,d),
set=k=>(D.Settings.find(x=>x.id==k)||{}).value||'',st=(pid,c)=>{const r=D.Stok.find(x=>x.id==c+'|'+pid);return r?N(r.qty):0},inc=(c,pid,n)=>({t:'Stok',inc:{cabang:c,pid,n}}),
cabs=()=>D.Branches.map(b=>b.nama),PUSAT=()=>(D.Branches[0]||{}).nama,isM=()=>ME.role!='Kasir',isA=()=>ME.role=='Admin',CB=()=>isA()&&VC?VC:ME.cabang;
const img=(f,w,qq=.6)=>new Promise(r=>{const i=new Image;i.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,w/i.width);c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);const u=c.toDataURL('image/jpeg',qq);r(u.length>48000?img(f,w*.8,qq):u)};i.src=URL.createObjectURL(f)});

/* ---------- LOGIN & DAFTAR ---------- */
const fld=(id,l,ty='text',ph='')=>`<label>${l}</label><input id=${id} type=${ty} placeholder="${ph}" autocapitalize=off autocomplete=off>`;
function authView(reg){document.body.innerHTML=`<div id=ts></div><main style="max-width:400px;padding-top:7vh"><div class=card><div style="text-align:center;margin-bottom:14px"><div class=lg>${ic('cart')}</div><h2>${reg?'Daftar Usaha Baru':'Selamat Datang'}</h2><small>${reg?'Buat akun admin sekaligus usaha Anda':'Masuk ke KasirKu'}</small></div>${API?'':'<p style="background:#ef444420;color:#ef4444;padding:10px;border-radius:12px;margin-bottom:10px;font-size:13px">Server belum diatur. Isi <b>API_DEFAULT</b> di index.html atau minta admin mengaturnya.</p>'}${reg?fld('ru','Nama usaha')+fld('rn','Nama pemilik / admin'):''}${fld('lu','Username')}${fld('lp','Password','password',reg?'Minimal 6 karakter':'')}${reg?fld('lp2','Ulangi password','password'):''}<button class=btn id=ab onclick="${reg?'doReg()':'login()'}">${reg?'Daftar & Buat Usaha':'Masuk'}</button><p style="text-align:center;margin-top:14px"><small>${reg?'Sudah punya akun?':'Belum punya akun?'}</small> <a style="color:var(--a);font-weight:700;cursor:pointer" onclick="authView(${reg?0:1})">${reg?'Masuk':'Daftar sekarang'}</a></p></div></main><div id=md onclick="if(event.target==this)cl()"></div>`;
document.querySelectorAll('input').forEach(i=>i.onkeydown=e=>e.key=='Enter'&&(reg?doReg():login()))}
const loginView=()=>authView(0),srv=()=>{if(!API){toast('Server belum diatur oleh admin','err');return false}return true};
async function login(u,p){if(!srv())return;const old=API;ME={user:u||$('#lu').value.trim(),p:p||$('#lp').value};if(!ME.user||!ME.p){ME=null;return toast('Isi username dan password','err')}const r=await api('login');
if(!r.ok){API=localStorage.api||API_DEFAULT;ME=null;return toast(r.err||'Gagal masuk','err')}ME={...r.user,p:ME.p};localStorage.api=API;localStorage.me=JSON.stringify(ME);boot()}
async function doReg(){if(!srv())return;const v=id=>$('#'+id).value.trim(),u=v('lu'),p=$('#lp').value;if(!v('ru')||!u)return toast('Lengkapi semua kolom','err');if(p.length<6)return toast('Password minimal 6 karakter','err');if(p!=$('#lp2').value)return toast('Password tidak sama','err');
$('#ab').disabled=true;$('#ab').textContent='Membuat usaha…';ME=null;const r=await api('register',0,0,{usaha:v('ru'),nama:v('rn'),user:u,pass:p});if(!r.ok){$('#ab').disabled=false;$('#ab').textContent='Daftar & Buat Usaha';return toast(r.err||'Gagal mendaftar','err')}toast('Usaha berhasil dibuat 🎉');login(u,p)}
function logout(){localStorage.removeItem('me');ME=null;loginView()}
const sa=()=>{const u=$('#s5').value.trim();if(!u.startsWith('http'))return toast('URL tidak valid','err');ask('Ganti server? Anda akan keluar & login ulang.',()=>{localStorage.api=u;API=u;logout()})};

/* ---------- MENU & NAV ---------- */
const MENU=[['home','home','Beranda'],['kasir','cart','Kasir'],['produk','box','Produk'],['bahan','flask','Bahan Baku'],['barang','truck','Kirim/Terima'],['laporan','chart','Laporan','M'],['piutang','book','Piutang'],['riwayat','receipt','Riwayat'],['shift','clock','Shift'],['absen','camera','Absen'],['gaji','wallet','Gaji'],['tim','users','Tim','A'],['set','gear','Setelan','A']],
ok=m=>!m[3]||(m[3]=='M'&&isM())||isA();
NEED={home:['Trx','Transfers','Stok','Branches'],kasir:['Products','Stok','Shifts'],produk:['Products','Stok','Branches'],bahan:['Products','Stok','Branches'],barang:['Transfers','Products','Stok','Branches'],laporan:['Trx','Branches'],piutang:['Debts'],riwayat:['Trx'],shift:['Shifts','Trx'],absen:['Absen','Users'],gaji:['Gaji','Users'],tim:['Users','Branches'],set:['Settings']};
const VW={};
function brand(){const n=set('toko')||'KasirKu',l=set('logo');document.title=n;let f=$('#fv');if(!f){f=document.createElement('link');f.id='fv';f.rel='icon';document.head.appendChild(f)}if(l)f.href=l;
$('#hd').innerHTML=`<div class=br>${l?`<img src="${l}">`:ic('cart')}<div><b>${n}</b><small>${ME.nama} · ${ME.role} · ${ME.cabang}</small></div></div><span><button class="btn s g" onclick=themeM()>🎨</button> <button class="btn s g" onclick=logout()>Keluar</button></span>`}
function boot(){document.body.innerHTML=`<div id=ts></div><header id=hd></header><aside id=sb></aside><main id=m></main><nav id=nv></nav><div id=md onclick="if(event.target==this)cl()"></div>`;
load('Settings','Branches').then(()=>{brand();navs()});brand();go(V)}
function navs(){const L=MENU.filter(ok),main=['home','kasir','produk'],a=(id,lab,i)=>`<a class="${V==id?'on':''}" onclick="go('${id}')">${ic(i)}${lab}</a>`;
$('#nv').innerHTML=a('home','Beranda','home')+a('kasir','Kasir','cart')+`<button class=fab onclick=quick()>${ic('plus')}</button>`+a('produk','Produk','box')+`<a class="${main.includes(V)?'':'on'}" onclick=more()>${ic('dots')}Lainnya</a>`;
$('#sb').innerHTML=L.map(m=>`<a class="${V==m[0]?'on':''}" onclick="go('${m[0]}')">${ic(m[1])}${m[2]}</a>`).join('')}
const more=()=>md(`<h3>Menu Lainnya</h3><br><div class=tl>${MENU.filter(ok).filter(m=>!['home','kasir','produk'].includes(m[0])).map(m=>`<a onclick="cl();go('${m[0]}')">${ic(m[1])}${m[2]}</a>`).join('')}</div>`),
quick=()=>md(`<h3>Aksi Cepat</h3><br><div class=tl><a onclick="cl();go('kasir')">${ic('cart')}Transaksi</a><a onclick="cl();go('barang').then(kf)">${ic('truck')}Kirim Barang</a><a onclick="cl();go('absen')">${ic('camera')}Absen</a>${isM()?`<a onclick="cl();go('produk').then(()=>pf())">${ic('box')}Produk Baru</a>`:''}</div>`);
async function go(v){V=v;stm&&stm.getTracks().forEach(t=>t.stop());navs();$('#m').innerHTML='<p><small>Memuat…</small></p>';VW[v]();await load(...NEED[v]);if(V==v)VW[v]()}
setInterval(async()=>{if(!ME||$('#md')?.className=='on'||/INPUT|SELECT/.test(document.activeElement.tagName)||V=='absen'||!$('#m'))return;const v=V;await load(...NEED[v]);if(v==V&&!/INPUT|SELECT/.test(document.activeElement.tagName)&&$('#md').className!='on')VW[v]()},8000);
function themeM(){md(`<h3>🎨 Tema</h3>${['#6366f1','#10b981','#f43f5e','#f97316','#0ea5e9','#8b5cf6','#14b8a6','#eab308'].map(c=>`<span onclick="localStorage.a='${c}';th()" style="display:inline-block;width:46px;height:46px;border-radius:14px;background:${c};margin:4px;cursor:pointer"></span>`).join('')}<br><label>Warna bebas</label><input type=color value="${localStorage.a||'#6366f1'}" oninput="localStorage.a=this.value;th()"><button class=btn onclick="localStorage.d=localStorage.d=='1'?'0':'1';th()">🌙 Mode gelap / terang</button>`)}
function form(t,f,v,cb){FC=[f,v,cb];md(`<h3>${t}</h3>`+f.map(([k,l,ty,o])=>`<label>${l}</label>`+(ty=='select'?`<select id=f_${k}>${o.map(x=>`<option ${v[k]==x?'selected':''}>${x}</option>`).join('')}</select>`:ty=='file'?`<input type=file accept="image/*" id=f_${k}>`:`<input id=f_${k} type=${ty||'text'} value="${v[k]??''}">`)).join('')+`<button class=btn onclick=fs()>Simpan</button><button class="btn g" style="margin-top:8px" onclick=cl()>Batal</button>`)}
async function fs(){const[f,v,cb]=FC,o={...v};for(const[k,,ty]of f){const e=$('#f_'+k);if(ty=='file'){if(e.files[0])o[k]=await img(e.files[0],220)}else o[k]=e.value}cl();await cb(o)}

/* ---------- BERANDA ---------- */
const canRecv=t=>t.status=='Dikirim'&&(isA()||t.ke==ME.cabang);
VW.home=()=>{const td=new Date().toLocaleDateString('en-CA'),T=D.Trx.filter(t=>t.status!='Batal'&&new Date(N(t.tgl)).toLocaleDateString('en-CA')==td&&(isA()||t.cabang==ME.cabang)),P=D.Transfers.filter(canRecv),low=D.Stok.filter(x=>x.cabang==ME.cabang&&N(x.qty)<=5).length;
$('#m').innerHTML=`<div class=card style="background:linear-gradient(135deg,var(--a),color-mix(in srgb,var(--a) 50%,#000));color:#fff"><small style="color:#fffc">Halo,</small><h2>${ME.nama} 👋</h2><small style="color:#fffc">${ME.cabang} · data diperbarui otomatis</small></div><div class=kpi><div><small>Omzet hari ini</small><b>${rp(T.reduce((s,t)=>s+N(t.total),0))}</b></div><div><small>Transaksi</small><b>${T.length}</b></div><div><small>Barang masuk</small><b>${P.length}</b></div><div><small>Stok menipis</small><b>${low}</b></div></div>${P.length?`<div class=card><b>Menunggu diterima</b>${P.map(trRow).join('')}</div>`:''}`};
const trRow=t=>`<div class=row><span><b>${t.nama}</b> × ${t.qty} <span class=tag>${t.tipe}</span><br><small>${t.dari} → ${t.ke} · ${dt(t.tgl)} · ${t.status}</small></span>${canRecv(t)?`<button class="btn s" onclick="trm('${t.id}')">Terima</button>`:''}</div>`;

/* ---------- PRODUK & BAHAN ---------- */

function gj(id){const g=D.Gaji.find(x=>x.id==id)||{id:uid('g'),periode:new Date().toISOString().slice(0,7)};md(`<h3>Gaji Tim</h3><label>Nama karyawan</label><select id=gu>${D.Users.map(u=>`<option value="${u.user}" ${g.user==u.user?'selected':''}>${u.nama}</option>`).join('')}</select><label>Periode</label><input id=gp type=month value="${g.periode}">${[['pokok','Gaji pokok'],['kasbon','Kasbon (−)'],['setoran','Setoran kurang (−)'],['absen','Tidak masuk (−)'],['fee','Fee penjualan (+)']].map(([k,l])=>`<label>${l}</label><input id=g_${k} type=number value="${g[k]||''}" oninput=gcalc()>`).join('')}<div class=net>Sisa gaji diterima<b id=pv></b></div><button class=btn onclick="gs('${g.id}')">Simpan</button>`);gcalc()}
async function gs(id){const u=D.Users.find(x=>x.user==$('#gu').value),g={id,user:u.user,nama:u.nama,periode:$('#gp').value,pokok:gv('pokok'),kasbon:gv('kasbon'),setoran:gv('setoran'),absen:gv('absen'),fee:gv('fee'),tgl:Date.now()};g.bersih=bersih(g);await save('Gaji',g);cl();toast('Gaji tersimpan');go('gaji')}

/* ---------- TIM ---------- */
VW.tim=()=>{$('#m').innerHTML=`<div class=card><b>Cabang</b>${D.Branches.map((b,i)=>`<div class=row><span>${b.nama} ${i?'':'<span class=tag>Pusat</span>'}<br><small>${b.alamat}</small></span><span><button class="btn s g" onclick="bf('${b.id}')">✏️</button>${i?` <button class="btn s r" onclick="bd('${b.id}')">🗑</button>`:''}</span></div>`).join('')}<button class=btn style="margin-top:8px" onclick=bf()>+ Cabang</button></div><div class=card><b>Karyawan</b>${D.Users.map(u=>`<div class=row><span>${u.nama} <small>(${u.user})</small><br><small>${u.role} · ${u.cabang} · ${u.aktif}</small></span><span><button class="btn s g" onclick="uf('${u.id}')">✏️</button> ${u.user!=ME.user?`<button class="btn s r" onclick="ud('${u.id}')">🗑</button>`:''}</span></div>`).join('')}<button class=btn style="margin-top:8px" onclick=uf()>+ Karyawan</button></div>`};
const bf=id=>form('Cabang (cabang pertama = Pusat)',[['nama','Nama cabang'],['alamat','Alamat']],D.Branches.find(b=>b.id==id)||{id:uid('b')},async o=>{await save('Branches',o);toast('Tersimpan');go('tim')}),bd=id=>ask('Hapus cabang ini?',async()=>{await del('Branches',id);go('tim')}),
uf=id=>form('Karyawan',[['nama','Nama'],['user','Username'],['pass','Password (kosongkan jika tidak diubah)','password'],['role','Peran','select',['Admin','Manager','Kasir']],['cabang','Cabang','select',cabs()],['aktif','Status akun','select',['Aktif','Nonaktif']]],D.Users.find(u=>u.id==id)||{id:uid('u'),role:'Kasir',aktif:'Aktif'},async o=>{if(!id&&!o.pass)return toast('Password wajib diisi','err');await save('Users',o);toast('Tersimpan');go('tim')}),ud=id=>ask('Hapus karyawan ini?',async()=>{await del('Users',id);go('tim')});

/* ---------- SETELAN ---------- */
VW.set=()=>{$('#m').innerHTML=`<div class=card><label>Nama usaha (mengubah nama aplikasi)</label><input id=s1 value="${set('toko')}"><label>Alamat / info di struk</label><input id=s2 value="${set('alamat')}"><label>Logo usaha (mengubah logo aplikasi)</label><input type=file id=s4 accept="image/*">${set('logo')?`<img src="${set('logo')}" width=70 style="border-radius:16px">`:''}<label>QRIS statis (gambar)</label><input type=file id=s3 accept="image/*">${set('qris')?`<img src="${set('qris')}" width=160>`:''}<button class=btn onclick=ss()>Simpan</button></div><div class=card><label>URL Server / Backend (Apps Script) — hanya admin</label><input id=s5 value="${API}"><button class="btn g" onclick=sa()>Simpan URL</button></div>`};
async function ss(){const b=[{t:'Settings',d:{id:'toko',value:$('#s1').value}},{t:'Settings',d:{id:'alamat',value:$('#s2').value}}];if($('#s4').files[0])b.push({t:'Settings',d:{id:'logo',value:await img($('#s4').files[0],160)}});if($('#s3').files[0])b.push({t:'Settings',d:{id:'qris',value:await img($('#s3').files[0],340)}});await batch(b);await load('Settings');brand();toast('Tersimpan');go('set')}

ME&&API?boot():loginView();
</script></body></html>
